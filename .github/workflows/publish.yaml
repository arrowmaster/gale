name: Publish
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: write

jobs:
  build:
    name: Build
    outputs:
      appVersion: ${{ steps.tauri.outputs.appVersion }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt update;
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libudev-dev patchelf \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 \
            libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 \
            gir1.2-webkit2-4.1

      - name: Use a linuxdeploy that leaves libwayland-client to the host
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/tauri
          curl -fsSL -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" | sha256sum -c
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      - name: Build Tauri app and upload artifacts
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          LINUXDEPLOY_OUTPUT_VERSION: __VERSION__

        with:
          tagName: __VERSION__
          releaseName: '__VERSION__'
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Compute AppImage hash
        if: matrix.platform == 'ubuntu-24.04'
        id: hash
        run: |
          SHA256=$(sha256sum src-tauri/target/release/bundle/appimage/*.AppImage | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
